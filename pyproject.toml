[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "docling>=2.74.0",
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "python-docx>=1.2.0",
  "pandas>=2.0.0",
  "pillow>=10.0.0",
  "markdownify>=1.2.3",
  "beautifulsoup4>=4.15.0",
  "lxml>=6.1.3",
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "python-multipart>=0.0.32",
]

[tool.uv.sources]
torch = [
  # 使用我们下面定义的索引 "pytorch-cu126"
   { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
   { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
# 定义 PyTorch CUDA 12.6 的专用索引
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
# explicit = true 确保只有我们指定的包从这里获取
explicit = true

[[tool.uv.index]]
# 保留默认的 PyPI 索引，用于安装其他非 PyTorch 的包
name = "pypi"
url = "https://pypi.org/simple"
default = true
