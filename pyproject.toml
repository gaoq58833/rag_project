[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "docling>=2.74.0",
  "torch>=2.6.0",
  "torchvision>=0.21.0",
  "python-docx>=1.2.0",
  "pandas>=2.0.0",
  "pillow>=10.0.0",
  "markdownify>=1.2.3",
  "beautifulsoup4>=4.15.0",
  "lxml>=6.1.3",
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "python-multipart>=0.0.32",
  # RAG 链路
  "openai>=1.50.0",
  "httpx>=0.27.0",  # DashScope 原生 API（rerank / 多模态 embedding）
  "qdrant-client>=1.13.0",
  "python-dotenv>=1.0.0",
  "psycopg2-binary>=2.9.9",
  "python-jose[cryptography]>=3.3.0",
  "bcrypt>=4.0.0",
  "jieba>=0.42.1",  # 中文分词，供 BM25 全文检索建索引
  "xlrd>=2.0.1",
]

[tool.uv.sources]
# torch/torchvision 让 uv 按平台选索引：
# - Windows (本地有 cu126) → pytorch-cu126 上的 CUDA 版
# - Linux/darwin (GitHub Runner) → PyPI 上 CPU 版
# 用平台 marker 完全隔离，避免 uv 在 Windows 上又去 PyPI 拉（交叉解析报错）
torch = [
   { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
   { index = "pypi", marker = "sys_platform != 'win32'" },
]
torchvision = [
   { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
   { index = "pypi", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
# 定义 PyTorch CUDA 12.6 的专用索引（Windows 本地用）
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
# 保留默认的 PyPI 索引，用于安装其他非 PyTorch 的包
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "xlwt>=1.3.0",
]
